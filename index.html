    <script>
      // Batch 3 — resolve Day/Night before first paint (no FOUC), same
      // approach as the Apex Clarity PLATFORM's own ThemeContext: read the
      // stored preference, fall back to prefers-color-scheme, set data-theme
      // on <html> synchronously. Own storage key — not shared with the
      // platform's apex-theme key, and never tied to cookie consent.
      (function () {
        try {
          var stored = localStorage.getItem('apex-website-theme');
          var pref = stored === 'day' || stored === 'night' || stored === 'system' ? stored : 'system';
          var resolved;
          if (pref === 'day') resolved = 'light';
          else if (pref === 'night') resolved = 'dark';
          else resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
